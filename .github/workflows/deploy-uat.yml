name: Deploy UAT

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: firma-opera-uat
  cancel-in-progress: false

jobs:
  deploy:
    environment: uat
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web-angular/package-lock.json
      - run: npm ci
        working-directory: web-angular
      - run: npm run build
        working-directory: web-angular
      - run: dotnet restore FirmaOperaCloud.slnx
      - run: dotnet test FirmaOperaCloud.slnx -c Release --no-restore
      - run: dotnet publish src/FirmaOperaCloud.Api/FirmaOperaCloud.Api.csproj -c Release -o publish -p:SkipAngularBuild=true --no-restore
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          package: publish
